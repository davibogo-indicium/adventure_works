version: 2

models:
  - name: dim_sales_orders
    description: >
      .This model builds the sales order dimension table, combining sales order headers, order details, 
      customer and credit card. It contains detailed financial and operational metrics for each sales 
      transaction.
    columns:
      - name: pk_sales_order_detail
        description: "Primary key representing each sales order detail."
        tests:
          - not_null
          - unique
      - name: client_name
        description: "The name of the client from the sale."
      - name: product_name
        description: "The name of the product from the sale."
      - name: card_type
        description: "The type of the paying card (credit or debit)."
      - name: sales_reason_name
        description: "The name reason of the sale."
      - name: sales_order_status
        description: "The status of the order."